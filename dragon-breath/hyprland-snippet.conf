# Pré-carrega o daemon do Ollama e aquece o modelo na memória no login
exec-once = ollama serve
exec-once = sleep 3 && curl -s http://127.0.0.1:11434/api/generate -d '{"model": "qwen2.5-coder:3b", "keep_alive": "30m"}' > /dev/null

# Atalhos do Dragon Breath
bind = SUPER, SPACE, exec, rofi -show drun -theme ~/.config/dragon-breath/config.rasi
bind = SUPER_SHIFT, SPACE, exec, ~/.config/dragon-breath/breath.py
