background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    color = rgba(13, 15, 18, 1.0)
}

label {
    monitor =
    text = 龙
    color = rgba(0, 168, 107, 0.9)
    font_size = 64
    font_family = Noto Sans CJK SC Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(212, 175, 55, 1.0)
    font_size = 48
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(0, 168, 107, 1.0)
    inner_color = rgba(22, 26, 32, 0.85)
    font_color = rgba(229, 233, 240, 1.0)
    check_color = rgba(212, 175, 55, 1.0)
    fail_color = rgba(227, 66, 52, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Selo de Jade (Senha)...</i>
    position = 0, -40
    halign = center
    valign = center
}
