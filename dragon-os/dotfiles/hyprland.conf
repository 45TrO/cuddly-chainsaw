# ============================================================================
# 🐉 DRAGON OS (龙) - HYPRLAND CONFIGURATION (Estética Ink & Jade)
# ============================================================================

monitor = , preferred, auto, 1

# --- 1. Inicialização do Ecossistema Dragon OS ---
exec-once = waybar
exec-once = dunst
# ollama, dragond, dragon-scales e dragon-whisper rodam como serviços systemd (ver dragon-install.sh)
# Aquece o modelo do Tier na memória (bash: 'source' não existe em sh POSIX)
exec-once = bash -c 'sleep 3; source ~/.config/dragon-breath/dragon_env.sh && curl -s http://127.0.0.1:11434/api/generate -d "{\"model\": \"$DRAGON_MODEL\", \"keep_alive\": \"30m\"}" > /dev/null'

# --- 2. Variáveis de Ambiente Wayland ---
env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# --- 3. Input (Teclado Ágil) ---
input {
    kb_layout = br
    repeat_rate = 45
    repeat_delay = 220
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- 4. Estética Ink & Jade (Bordas e Gaps) ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Gradiente Verde Jade Imperial (#00A86B) -> Dourado Celestial (#D4AF37)
    col.active_border = rgba(00A86Bee) rgba(D4AF37ee) 45deg
    col.inactive_border = rgba(161A20aa)
    layout = dwindle
    allow_tearing = true # Menor latência para jogos
}

# --- 5. Sombra e Blur Nanquim ---
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(0D0F12ee)
    }
}

# --- 6. Animações: "A Dança do Dragão" (Curvas Sinuosas e Rápidas) ---
animations {
    enabled = true
    # Curvas Bézier customizadas: disparo explosivo e frenagem suave
    bezier = dragonFlight, 0.05, 0.9, 0.1, 1.05
    bezier = jadeFlow, 0.25, 1, 0.5, 1
    bezier = inkFade, 0.4, 0, 0.2, 1

    animation = windows, 1, 3, dragonFlight, popin 80%
    animation = windowsOut, 1, 2, inkFade, popin 80%
    animation = border, 1, 5, jadeFlow
    animation = borderangle, 1, 40, jadeFlow, loop
    animation = fade, 1, 3, inkFade
    animation = workspaces, 1, 4, dragonFlight, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1 # Adaptive Sync ativado para fluidez
}

# --- 7. Regras de Janela (Window Rules) ---
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = stayfocused, class:^(Rofi)$
windowrulev2 = float, title:^(🐉.*)$

# --- 8. Atalhos "Zero-Mouse" e IA Nativa ---
$mainMod = SUPER
$term = ghostty # (ou kitty, se preferir)

# Módulos de IA do Dragon OS
bind = $mainMod, SPACE, exec, rofi -show drun -theme ~/.config/dragon-breath/config.rasi
bind = $mainMod SHIFT, SPACE, exec, ~/.config/dragon-breath/breath.py
bind = $mainMod, V, exec, ~/.config/dragon-breath/whispering_wind.sh
# Dragon Eye: Captura Inteligente (OCR + Visão Computacional Local)
bind = $mainMod SHIFT, S, exec, ~/.config/dragon-breath/dragon_eye.py
# Descarregar VRAM manualmente com Super + Shift + Backspace
# (PYTHONPATH necessário: o 'import dragond' não acha o módulo fora da pasta dele)
bind = $mainMod SHIFT, BACKSPACE, exec, PYTHONPATH=$HOME/.config/dragon-breath python3 -c "import dragond; dragond.evict_all_models('Atalho Manual')"

# Sistema e Apps Básicos
bind = $mainMod, RETURN, exec, $term
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod SHIFT, E, exit,

# Navegação Vim (H, J, K, L)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Mover Janelas com Estilo Vim (Super + Shift + H/J/K/L)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Redimensionar Painéis (Super + Ctrl + H/J/K/L)
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40

# Workspaces (1 a 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse Binds (para quando precisar)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
